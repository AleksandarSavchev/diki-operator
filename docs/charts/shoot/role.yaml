apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: diki-operator
  namespace: kube-system
  labels:
    app.kubernetes.io/name: diki-operator
rules:
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - update
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
